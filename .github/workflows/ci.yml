name: CI

on:
  push:
  pull_request:

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and run solver
        run: make run

      - name: Check error report
        run: |
          test -f output/errors.csv
          # Initial condition must match the exact pulse to machine precision.
          python3 - <<'PY'
          import csv
          with open("output/errors.csv") as f:
              rows = list(csv.DictReader(f))
          assert rows, "errors.csv is empty"
          e0 = float(rows[0]["L2"])
          assert e0 < 1e-12, f"E_2(t=0) too large: {e0}"
          print(f"OK: E_2(t=0) = {e0:.3e}, rows = {len(rows)}")
          PY
