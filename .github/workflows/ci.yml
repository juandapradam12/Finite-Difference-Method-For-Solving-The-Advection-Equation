name: CI

on:
  push:
  pull_request:

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and run solver
        run: make run

      - name: Check error report
        run: |
          test -f output/errors.csv
          python3 - <<'PY'
          import csv
          with open("output/errors.csv") as f:
              rows = list(csv.DictReader(f))
          assert rows, "errors.csv is empty"
          e0 = float(rows[0]["L2"])
          assert e0 < 1e-12, f"E_2(t=0) too large: {e0}"
          print(f"OK: E_2(t=0) = {e0:.3e}, rows = {len(rows)}")
          PY

      - name: Grid convergence study
        run: make convergence

      - name: Check observed order ≈ 1
        run: |
          test -f output/convergence.csv
          python3 - <<'PY'
          import csv
          with open("output/convergence.csv") as f:
              rows = list(csv.DictReader(f))
          rates = [float(r["rate_L2"]) for r in rows if r["rate_L2"]]
          assert rates, "no convergence rates found"
          for p in rates:
              assert 0.7 <= p <= 1.3, f"unexpected rate_L2={p}"
          print("OK: rate_L2 values =", [f"{p:.3f}" for p in rates])
          PY
